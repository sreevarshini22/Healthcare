{% extends "base.html" %}

{% block title %}Create Account – MediVault{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border shadow-sm rounded-3">
                <div class="card-header text-center py-4 border-bottom">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-2" style="width: 48px; height: 48px; background-color: var(--surface-subtle);">
                        <i class="bi bi-person-plus-fill fs-4" style="color: var(--link-color);"></i>
                    </div>
                    <h1 class="h4 fw-bold mb-1">Create Account</h1>
                    <p class="small mb-0" style="color: var(--text-muted);">Register with your email address and phone number</p>
                </div>

                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text" style="background-color: var(--surface-subtle); color: var(--text-secondary); border-color: var(--border-color);"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required autofocus placeholder="name@example.com">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="phone_number" class="form-label fw-semibold small">Phone Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text" style="background-color: var(--surface-subtle); color: var(--text-secondary); border-color: var(--border-color);"><i class="bi bi-telephone"></i></span>
                                <input type="tel" class="form-control" id="phone_number" name="phone_number" value="{{ phone_number or '' }}" required placeholder="+1 (555) 000-0000">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-mv-primary w-100 py-2 fw-semibold">
                            Submit
                        </button>
                    </form>
                </div>

                <div class="card-footer text-center py-3 border-top">
                    <span class="small" style="color: var(--text-muted);">Already have an account?</span>
                    <a href="{{ url_for('auth.login') }}" class="small fw-semibold ms-1" style="color: var(--link-color);">Log In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
