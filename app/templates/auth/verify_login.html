{% extends "base.html" %}

{% block title %}Verify Login Code – MediVault{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border shadow-sm rounded-3">
                <div class="card-header text-center py-4 border-bottom">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-2" style="width: 48px; height: 48px; background-color: var(--surface-subtle);">
                        <i class="bi bi-shield-check fs-4" style="color: var(--mv-green);"></i>
                    </div>
                    <h1 class="h4 fw-bold mb-1">Enter Verification Code</h1>
                    <p class="small mb-0" style="color: var(--text-muted);">
                        We sent a 6-digit code to your {{ channel|upper }}: 
                        <strong style="color: var(--text-primary);">{{ masked_target }}</strong>
                    </p>
                </div>

                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.verify_login', token=token, next=next) }}">
                        <div class="mb-4">
                            <label for="otp_code" class="form-label fw-semibold small">
                                6-Digit Verification Code <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control text-center fs-4 fw-bold font-monospace py-2" 
                                    id="otp_code" name="otp_code" maxlength="6" inputmode="numeric" 
                                    pattern="[0-9]{6}" required autofocus placeholder="------" 
                                    style="letter-spacing: 8px;">
                        </div>

                        <button type="submit" class="btn btn-mv-primary w-100 py-2 fw-semibold mb-3">
                            Verify & Sign In
                        </button>
                    </form>

                    <form method="POST" action="{{ url_for('auth.resend_login_otp') }}" class="text-center">
                        <input type="hidden" name="token" value="{{ token }}">
                        <span class="small" style="color: var(--text-muted);">Didn't receive the code?</span>
                        <button type="submit" class="btn btn-link btn-sm p-0 ms-1 fw-semibold text-decoration-none" style="color: var(--link-color);">
                            Resend Code
                        </button>
                    </form>
                </div>

                <div class="card-footer text-center py-3 border-top">
                    <a href="{{ url_for('auth.login') }}" class="small text-decoration-none" style="color: var(--text-muted);">
                        <i class="bi bi-arrow-left me-1"></i> Use a different email or phone number
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
