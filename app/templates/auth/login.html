{% extends "base.html" %}

{% block title %}Login – MediVault{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border shadow-sm rounded-3">
                <div class="card-header text-center py-4 border-bottom">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-2" style="width: 48px; height: 48px; background-color: var(--surface-subtle);">
                        <i class="bi bi-box-arrow-in-right fs-4" style="color: var(--link-color);"></i>
                    </div>
                    <h1 class="h4 fw-bold mb-1">Sign In</h1>
                    <p class="small mb-0" style="color: var(--text-muted);">Enter your email address or phone number</p>
                </div>

                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                        <div class="mb-4">
                            <label for="identifier" class="form-label fw-semibold small">
                                Email Address or Phone Number <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text" style="background-color: var(--surface-subtle); color: var(--text-secondary); border-color: var(--border-color);"><i class="bi bi-person-badge"></i></span>
                                <input type="text" class="form-control" id="identifier" name="identifier" 
                                       value="{{ identifier or '' }}" required autofocus 
                                       placeholder="name@example.com or +1 (555) 000-0000">
                            </div>
                            <div class="form-text small" style="color: var(--text-muted);">A 6-digit verification code will be sent to verify your identity.</div>
                        </div>

                        <button type="submit" class="btn btn-mv-primary w-100 py-2 fw-semibold">
                            Continue
                        </button>
                    </form>
                </div>

                <div class="card-footer text-center py-3 border-top">
                    <span class="small" style="color: var(--text-muted);">Don't have an account?</span>
                    <a href="{{ url_for('auth.register') }}" class="small fw-semibold ms-1" style="color: var(--link-color);">Create Account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
